<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <rect width="1000" height="480" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  
  <text x="500" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#58a6ff" text-anchor="middle">Phase 1: Lexical Ingestion Module Flow &amp; Data Pipeline</text>
  <text x="500" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Raw Source Bytes → Tree-sitter CST → FNV-1a Interner → Monotonic Token Corpus (.tca)</text>

  <!-- Input Card -->
  <rect x="40" y="90" width="260" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="170" y="120" font-family="sans-serif" font-size="14" font-weight="600" fill="#79c0ff" text-anchor="middle">SourceManifest</text>
  <text x="170" y="145" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">file_paths, language_overrides</text>
  <text x="170" y="162" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">TokenFilter configuration</text>

  <!-- Step 1 Card -->
  <rect x="360" y="90" width="260" height="90" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="490" y="120" font-family="sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="middle">SourceManifestBuilder</text>
  <text x="490" y="145" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Lexicographical path sorting</text>
  <text x="490" y="162" font-family="sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle">Deterministic file_id (0..F-1)</text>

  <!-- Step 2 Card -->
  <rect x="680" y="90" width="280" height="90" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
  <text x="820" y="120" font-family="sans-serif" font-size="14" font-weight="600" fill="#7ee787" text-anchor="middle">AdapterRegistry &amp; Parser</text>
  <text x="820" y="145" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Language auto-detection</text>
  <text x="820" y="162" font-family="sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">TreeSitterParser FFI</text>

  <!-- CSTWalker -->
  <rect x="680" y="230" width="280" height="90" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="820" y="260" font-family="sans-serif" font-size="14" font-weight="600" fill="#e3b341" text-anchor="middle">CSTWalker (DFS Traverse)</text>
  <text x="820" y="285" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Emits RawTokens in source order</text>
  <text x="820" y="302" font-family="sans-serif" font-size="11" fill="#e3b341" text-anchor="middle">O(n_cst) time, O(depth) stack</text>

  <!-- Allocator & Interner -->
  <rect x="360" y="230" width="260" height="90" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="490" y="260" font-family="sans-serif" font-size="14" font-weight="600" fill="#d2a8ff" text-anchor="middle">Allocator &amp; StringInterner</text>
  <text x="490" y="285" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Monotonic AtomicU32 token_id</text>
  <text x="490" y="302" font-family="sans-serif" font-size="11" fill="#bc8cff" text-anchor="middle">64-bit FNV-1a deduplication</text>

  <!-- Builder & Serializer -->
  <rect x="40" y="230" width="260" height="90" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="170" y="260" font-family="sans-serif" font-size="14" font-weight="600" fill="#ff7b72" text-anchor="middle">TokenCorpusBuilder</text>
  <text x="170" y="285" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Sorts 16B TokenRecords by sort_key</text>
  <text x="170" y="302" font-family="sans-serif" font-size="11" fill="#ff7b72" text-anchor="middle">Asserts Invariants 1–4</text>

  <!-- Final Artifact Card -->
  <rect x="40" y="370" width="920" height="75" rx="8" fill="#1f6feb" fill-opacity="0.15" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="500" y="400" font-family="sans-serif" font-size="15" font-weight="700" fill="#58a6ff" text-anchor="middle">TokenCorpusArtifact (.tca binary format)</text>
  <text x="500" y="425" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">64B Header | SourceFileRecord[] | Sorted 16B TokenRecord[] (Forward) | 16B TokenEntry[] (Backward) | CRC-64 Checksum</text>
</svg>