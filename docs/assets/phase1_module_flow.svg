<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 470" role="img"><style>
      text { font-family: system-ui, sans-serif; }
      .th { font-size: 12px; font-weight: bold; fill: #1f2937; }
      .ts { font-size: 10px; fill: #4b5563; }
      rect { fill: #f3f4f6; stroke: #d1d5db; }
      .c-gray rect { fill: #f3f4f6; stroke: #9ca3af; }
      .c-purple rect { fill: #f3e8ff; stroke: #c084fc; }
      .c-green rect { fill: #dcfce7; stroke: #4ade80; }
      .c-blue rect { fill: #dbeafe; stroke: #60a5fa; }
    </style>
  <title>Phase 1 module flow diagram</title>
  <desc>Data flows from SourceManifest through seven modules to produce TokenCorpusArtifact</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- INPUT -->
  <g class="c-gray" onclick="sendPrompt('What fields does SourceManifest contain in Phase 1?')" style="cursor:pointer">
    <rect x="20" y="30" width="150" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="95" y="50" text-anchor="middle" dominant-baseline="central">SourceManifest</text>
    <text class="ts" x="95" y="68" text-anchor="middle" dominant-baseline="central">file_paths, lang overrides, filter</text>
  </g>

  <!-- Arrow down -->
  <line x1="95" y1="82" x2="95" y2="110" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ManifestBuilder -->
  <g class="c-purple" onclick="sendPrompt('What does SourceManifestBuilder do in Phase 1?')" style="cursor:pointer">
    <rect x="20" y="110" width="150" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="95" y="130" text-anchor="middle" dominant-baseline="central">ManifestBuilder</text>
    <text class="ts" x="95" y="148" text-anchor="middle" dominant-baseline="central">Sort paths, assign file_ids</text>
  </g>

  <line x1="95" y1="162" x2="95" y2="190" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#arr)"/>

  <!-- AdapterRegistry -->
  <g class="c-purple" onclick="sendPrompt('How does AdapterRegistry detect language and dispatch to the right LanguageAdapter?')" style="cursor:pointer">
    <rect x="20" y="190" width="150" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="95" y="210" text-anchor="middle" dominant-baseline="central">AdapterRegistry</text>
    <text class="ts" x="95" y="228" text-anchor="middle" dominant-baseline="central">ext → LanguageAdapter</text>
  </g>

  <!-- JavaLanguageAdapter side -->
  <g class="c-purple" onclick="sendPrompt('How does JavaLanguageAdapter map tree-sitter node types to Sigma_T in Phase 1?')" style="cursor:pointer">
    <rect x="220" y="190" width="150" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="295" y="210" text-anchor="middle" dominant-baseline="central">JavaLanguageAdapter</text>
    <text class="ts" x="295" y="228" text-anchor="middle" dominant-baseline="central">ts_kind → Σ_T TokenType</text>
  </g>
  <line x1="170" y1="216" x2="218" y2="216" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#arr)"/>

  <line x1="95" y1="242" x2="95" y2="270" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#arr)"/>

  <!-- TreeSitterParser -->
  <g class="c-teal" onclick="sendPrompt('How does TreeSitterParser parse source files in Phase 1?')" style="cursor:pointer">
    <rect x="20" y="270" width="150" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="95" y="290" text-anchor="middle" dominant-baseline="central">TreeSitterParser</text>
    <text class="ts" x="95" y="308" text-anchor="middle" dominant-baseline="central">source bytes → TSTree</text>
  </g>

  <line x1="170" y1="296" x2="218" y2="296" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#arr)"/>

  <!-- CSTWalker -->
  <g class="c-teal" onclick="sendPrompt('How does CSTWalker traverse the Tree-sitter CST to extract tokens in Phase 1?')" style="cursor:pointer">
    <rect x="220" y="270" width="150" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="295" y="290" text-anchor="middle" dominant-baseline="central">CSTWalker</text>
    <text class="ts" x="295" y="308" text-anchor="middle" dominant-baseline="central">DFS → RawToken stream</text>
  </g>

  <line x1="370" y1="296" x2="418" y2="296" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#arr)"/>

  <!-- TokenIdAllocator -->
  <g class="c-amber" onclick="sendPrompt('How does TokenIdAllocator guarantee globally unique monotonic token_ids?')" style="cursor:pointer">
    <rect x="420" y="270" width="150" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="495" y="290" text-anchor="middle" dominant-baseline="central">TokenIdAllocator</text>
    <text class="ts" x="495" y="308" text-anchor="middle" dominant-baseline="central">AtomicU32, global monotone</text>
  </g>

  <!-- StringInterner -->
  <g class="c-amber" onclick="sendPrompt('How does StringInterner work with FNV-1a hashing in Phase 1?')" style="cursor:pointer">
    <rect x="420" y="350" width="150" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="495" y="370" text-anchor="middle" dominant-baseline="central">StringInterner</text>
    <text class="ts" x="495" y="388" text-anchor="middle" dominant-baseline="central">FNV-1a → text_id dedup</text>
  </g>
  <line x1="495" y1="322" x2="495" y2="348" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Down from Walker to Builder area -->
  <line x1="295" y1="322" x2="295" y2="350" stroke="var(--text-muted)" stroke-width="1"/>
  <line x1="495" y1="402" x2="495" y2="418" stroke="var(--text-muted)" stroke-width="1"/>
  <line x1="295" y1="350" x2="218" y2="350" stroke="var(--text-muted)" stroke-width="1"/>
  <line x1="218" y1="350" x2="218" y2="418" stroke="var(--text-muted)" stroke-width="1"/>
  <line x1="218" y1="418" x2="270" y2="418" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="418" y1="418" x2="370" y2="418" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#arr)"/>

  <!-- TokenCorpusBuilder -->
  <g class="c-coral" onclick="sendPrompt('What does TokenCorpusBuilder assemble and how does it sort in Phase 1?')" style="cursor:pointer">
    <rect x="270" y="400" width="150" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="345" y="420" text-anchor="middle" dominant-baseline="central">TokenCorpusBuilder</text>
    <text class="ts" x="345" y="438" text-anchor="middle" dominant-baseline="central">Assemble + sort records</text>
  </g>

  <!-- Output artifact -->
  <line x1="345" y1="452" x2="345" y2="470" stroke="var(--text-muted)" stroke-width="1"/>

  <!-- Legend -->
  <rect x="20" y="418" width="12" height="12" rx="2" fill="#7F77DD" opacity="0.7"/>
  <text class="ts" x="36" y="428" dominant-baseline="central">Orchestration</text>
  <rect x="20" y="436" width="12" height="12" rx="2" fill="#1D9E75" opacity="0.7"/>
  <text class="ts" x="36" y="446" dominant-baseline="central">Parsing</text>
  <rect x="100" y="418" width="12" height="12" rx="2" fill="#BA7517" opacity="0.7"/>
  <text class="ts" x="116" y="428" dominant-baseline="central">ID / Interning</text>
  <rect x="100" y="436" width="12" height="12" rx="2" fill="#D85A30" opacity="0.7"/>
  <text class="ts" x="116" y="446" dominant-baseline="central">Assembly</text>

  <text class="ts" x="345" y="464" text-anchor="middle" dominant-baseline="central">TokenCorpusArtifact (.tca)</text>
</svg>