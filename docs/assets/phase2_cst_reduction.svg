<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 380" role="img"><style>
      text { font-family: system-ui, sans-serif; }
      rect { fill: #f3f4f6; stroke: #d1d5db; }
    </style>
  <title>CST to AST reduction decision tree for a Java if-return statement</title>
  <desc>Shows Tree-sitter CST nodes with KEEP, ELIMINATE, or DROP reduction decisions</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Root: if_statement KEEP -->
  <g class="c-teal" style="cursor:pointer" onclick="setInfo('if_statement','KEEP → NN_IF_STMT (0x0D)','This becomes an AST internal node. Its kept children (condition, then-branch) are attached as children in the BP tree.')">
    <rect x="240" y="20" width="190" height="36" rx="6" stroke-width="0.5"/>
    <text class="th" x="335" y="38" text-anchor="middle" dominant-baseline="central">if_statement</text>
  </g>
  <text class="ts" x="335" y="62" text-anchor="middle">KEEP → NN_IF_STMT</text>

  <!-- Connectors from if_statement -->
  <line x1="280" y1="56" x2="145" y2="100" stroke="var(--border-strong)" stroke-width="0.5"/>
  <line x1="335" y1="56" x2="335" y2="100" stroke="var(--border-strong)" stroke-width="0.5"/>
  <line x1="390" y1="56" x2="535" y2="100" stroke="var(--border-strong)" stroke-width="0.5"/>

  <!-- Child 1: "if" keyword DROP -->
  <g class="c-coral" style="cursor:pointer" onclick="setInfo('if','DROP','Pure structural keyword. Discarded. The NN_IF_STMT parent node already encodes the semantics.')">
    <rect x="70" y="100" width="80" height="30" rx="4" stroke-width="0.5"/>
    <text class="th" x="110" y="115" text-anchor="middle" dominant-baseline="central">if</text>
  </g>
  <text class="ts" x="110" y="138" text-anchor="middle">DROP</text>

  <!-- Child 2: parenthesized_expression ELIMINATE -->
  <g class="c-purple" style="cursor:pointer" onclick="setInfo('parenthesized_expression','ELIMINATE — children attached to if_statement','Grammar disambiguation wrapper. The (x &gt; 0) parens are structural noise. Children promoted to grandparent (if_statement).')">
    <rect x="225" y="100" width="220" height="30" rx="4" stroke-width="0.5"/>
    <text class="th" x="335" y="115" text-anchor="middle" dominant-baseline="central">parenthesized_expression</text>
  </g>
  <text class="ts" x="335" y="138" text-anchor="middle">ELIMINATE → flatten children</text>

  <!-- Child 3: return_statement KEEP -->
  <g class="c-teal" style="cursor:pointer" onclick="setInfo('return_statement','KEEP → NN_RETURN_STMT (0x18)','Becomes an AST node. Its child identifier x is kept as a leaf token.')">
    <rect x="455" y="100" width="160" height="30" rx="4" stroke-width="0.5"/>
    <text class="th" x="535" y="115" text-anchor="middle" dominant-baseline="central">return_statement</text>
  </g>
  <text class="ts" x="535" y="138" text-anchor="middle">KEEP → NN_RETURN_STMT</text>

  <!-- Under parenthesized_expression: binary_expression -->
  <line x1="335" y1="130" x2="335" y2="168" stroke="var(--border-strong)" stroke-width="0.5"/>
  <g class="c-teal" style="cursor:pointer" onclick="setInfo('binary_expression','KEEP → NN_BINARY_EXPR (0x1E), operator_id encodes &gt; in NodeAttr bits 19-12','Becomes AST node. Children: identifier x, operator &gt;, integer literal 0.')">
    <rect x="240" y="168" width="190" height="30" rx="4" stroke-width="0.5"/>
    <text class="th" x="335" y="183" text-anchor="middle" dominant-baseline="central">binary_expression</text>
  </g>
  <text class="ts" x="335" y="204" text-anchor="middle">KEEP → NN_BINARY_EXPR</text>

  <!-- Under binary_expression: three children -->
  <line x1="295" y1="198" x2="215" y2="238" stroke="var(--border-strong)" stroke-width="0.5"/>
  <line x1="335" y1="198" x2="335" y2="238" stroke="var(--border-strong)" stroke-width="0.5"/>
  <line x1="375" y1="198" x2="455" y2="238" stroke="var(--border-strong)" stroke-width="0.5"/>

  <!-- x: identifier KEEP leaf -->
  <g class="c-blue" style="cursor:pointer" onclick="setInfo('identifier x','KEEP → NN_IDENTIFIER_EXPR (0x2B), leaf token','Token leaf in the AST. token_id looked up via binary search on sorted TCA TokenRecord[] by (file_id, line, col) sort_key.')">
    <rect x="150" y="238" width="120" height="30" rx="4" stroke-width="0.5"/>
    <text class="th" x="210" y="253" text-anchor="middle" dominant-baseline="central">identifier "x"</text>
  </g>
  <text class="ts" x="210" y="276" text-anchor="middle">KEEP → leaf token</text>

  <!-- > operator DROP -->
  <g class="c-coral" style="cursor:pointer" onclick="setInfo('>  operator','DROP','Pure operator token. The operator semantics are captured in the NodeAttr bits 19-12 of the parent NN_BINARY_EXPR node (operator_id = GT).')">
    <rect x="295" y="238" width="60" height="30" rx="4" stroke-width="0.5"/>
    <text class="th" x="325" y="253" text-anchor="middle" dominant-baseline="central">&gt;</text>
  </g>
  <text class="ts" x="325" y="276" text-anchor="middle">DROP</text>

  <!-- 0: decimal_integer_literal KEEP leaf -->
  <g class="c-blue" style="cursor:pointer" onclick="setInfo('decimal_integer_literal 0','KEEP → NN_LITERAL (0x2C), leaf token','Integer literal. Token text interned in TCA string table. text_id stored in TokenRecord.')">
    <rect x="375" y="238" width="170" height="30" rx="4" stroke-width="0.5"/>
    <text class="th" x="460" y="253" text-anchor="middle" dominant-baseline="central">decimal_integer_literal "0"</text>
  </g>
  <text class="ts" x="460" y="276" text-anchor="middle">KEEP → leaf token</text>

  <!-- Under return_statement -->
  <line x1="535" y1="130" x2="535" y2="298" stroke="var(--border-strong)" stroke-width="0.5"/>
  <g class="c-blue" style="cursor:pointer" onclick="setInfo('identifier x (return)','KEEP → NN_IDENTIFIER_EXPR (0x2B), leaf token','The return value x. Same identifier string, different token_id (different source position → different sort_key).')">
    <rect x="455" y="298" width="160" height="30" rx="4" stroke-width="0.5"/>
    <text class="th" x="535" y="313" text-anchor="middle" dominant-baseline="central">identifier "x" (return val)</text>
  </g>
  <text class="ts" x="535" y="335" text-anchor="middle">KEEP → leaf token</text>

  <!-- semicolon DROP -->
  <line x1="535" y1="130" x2="430" y2="298" stroke="var(--border-strong)" stroke-width="0.5"/>
  <g class="c-coral" style="cursor:pointer" onclick="setInfo(';  semicolon','DROP','Structural punctuation. Conveys no semantic information not already present in the parent NN_RETURN_STMT node.')">
    <rect x="370" y="298" width="50" height="30" rx="4" stroke-width="0.5"/>
    <text class="th" x="395" y="313" text-anchor="middle" dominant-baseline="central">;</text>
  </g>
  <text class="ts" x="395" y="335" text-anchor="middle">DROP</text>
</svg>