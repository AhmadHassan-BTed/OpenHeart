<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <rect width="1000" height="420" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  
  <text x="500" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#58a6ff" text-anchor="middle">Phase 2: CST Reduction &amp; Balanced Parentheses AST Encoding</text>
  <text x="500" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Tree-sitter CST for if (x &gt; 0) return x; → Ordinal AST Forest → MSB-Packed BP Bitstring</text>

  <!-- Legend -->
  <g transform="translate(180, 85)">
    <rect x="0" y="0" width="130" height="28" rx="4" fill="#238636" fill-opacity="0.25" stroke="#238636" stroke-width="1"/>
    <text x="65" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#7ee787" text-anchor="middle">KEEP → AST Node</text>

    <rect x="150" y="0" width="160" height="28" rx="4" fill="#a371f7" fill-opacity="0.25" stroke="#a371f7" stroke-width="1"/>
    <text x="230" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#d2a8ff" text-anchor="middle">ELIMINATE → Flatten Up</text>

    <rect x="330" y="0" width="140" height="28" rx="4" fill="#f85149" fill-opacity="0.25" stroke="#f85149" stroke-width="1"/>
    <text x="400" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#ff7b72" text-anchor="middle">DROP → Discard</text>

    <rect x="490" y="0" width="140" height="28" rx="4" fill="#1f6feb" fill-opacity="0.25" stroke="#1f6feb" stroke-width="1"/>
    <text x="560" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#79c0ff" text-anchor="middle">TOKEN → Leaf AST Node</text>
  </g>

  <!-- Tree Visualizer -->
  <!-- Level 1: Root IF_STMT -->
  <rect x="420" y="135" width="160" height="40" rx="6" fill="#238636" fill-opacity="0.3" stroke="#238636" stroke-width="1.5"/>
  <text x="500" y="160" font-family="sans-serif" font-size="13" font-weight="700" fill="#7ee787" text-anchor="middle">NN_IF_STMT</text>

  <!-- Level 2: Condition & Consequent -->
  <line x1="460" y1="175" x2="300" y2="220" stroke="#30363d" stroke-width="1.5"/>
  <line x1="540" y1="175" x2="700" y2="220" stroke="#30363d" stroke-width="1.5"/>

  <rect x="220" y="220" width="160" height="38" rx="6" fill="#238636" fill-opacity="0.3" stroke="#238636" stroke-width="1.5"/>
  <text x="300" y="244" font-family="sans-serif" font-size="12" font-weight="700" fill="#7ee787" text-anchor="middle">NN_BINARY_EXPR (&gt;)</text>

  <rect x="620" y="220" width="160" height="38" rx="6" fill="#238636" fill-opacity="0.3" stroke="#238636" stroke-width="1.5"/>
  <text x="700" y="244" font-family="sans-serif" font-size="12" font-weight="700" fill="#7ee787" text-anchor="middle">NN_RETURN_STMT</text>

  <!-- Level 3: Leaves -->
  <line x1="260" y1="258" x2="180" y2="295" stroke="#30363d" stroke-width="1.5"/>
  <line x1="340" y1="258" x2="420" y2="295" stroke="#30363d" stroke-width="1.5"/>
  <line x1="700" y1="258" x2="700" y2="295" stroke="#30363d" stroke-width="1.5"/>

  <rect x="110" y="295" width="140" height="35" rx="6" fill="#1f6feb" fill-opacity="0.3" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="180" y="317" font-family="sans-serif" font-size="11" font-weight="600" fill="#79c0ff" text-anchor="middle">Identifier (x)</text>

  <rect x="350" y="295" width="140" height="35" rx="6" fill="#1f6feb" fill-opacity="0.3" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="420" y="317" font-family="sans-serif" font-size="11" font-weight="600" fill="#79c0ff" text-anchor="middle">IntLiteral (0)</text>

  <rect x="630" y="295" width="140" height="35" rx="6" fill="#1f6feb" fill-opacity="0.3" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="700" y="317" font-family="sans-serif" font-size="11" font-weight="600" fill="#79c0ff" text-anchor="middle">Identifier (x)</text>

  <!-- BP Encoding Result Banner -->
  <rect x="40" y="350" width="920" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="380" font-family="sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">BP Bitstring:</text>
  <text x="160" y="380" font-family="monospace" font-size="14" font-weight="700" fill="#7ee787">1 1 1 0 1 0 0 1 1 0 0 0</text>
  <text x="450" y="380" font-family="sans-serif" font-size="11" fill="#8b949e">(1 = Open / Pre-order visit, 0 = Close / Post-order exit, 5 nodes = 10 bits)</text>
</svg>