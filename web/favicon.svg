<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#050505"/>
  
  <!-- Minimalist Line-Art Wireframe 3D Spiky Orb -->
  <g fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Spiky Starburst Line Contour -->
    <polygon points="32,4 38,14 48,8 45,19 56,19 49,28 60,32 50,38 58,47 46,48 49,60 37,53 32,62 27,53 15,60 18,48 6,47 14,38 4,32 15,28 8,19 19,19 16,8 26,14"/>

    <!-- Inner Geometric Wireframe Facet Lines -->
    <line x1="32" y1="4" x2="32" y2="32"/>
    <line x1="60" y1="32" x2="32" y2="32"/>
    <line x1="32" y1="62" x2="32" y2="32"/>
    <line x1="4" y1="32" x2="32" y2="32"/>

    <!-- Diagonal Wireframe Spikes -->
    <line x1="48" y1="8" x2="32" y2="32"/>
    <line x1="58" y1="47" x2="32" y2="32"/>
    <line x1="15" y1="60" x2="32" y2="32"/>
    <line x1="8" y1="19" x2="32" y2="32"/>

    <!-- Inner Crystalline Octahedron Core -->
    <polygon points="32,18 46,32 32,46 18,32" stroke="#a3a3a3" stroke-width="1"/>
  </g>
</svg>
